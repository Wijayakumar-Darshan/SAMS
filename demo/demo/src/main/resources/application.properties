spring.application.name=sams

# ==================================================
# SERVER — RENDER
# ==================================================
# Render automatically provides PORT.
server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=framework

# ==================================================
# MYSQL — AIVEN
# ==================================================
# Real values are configured in Render Environment.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Small connection pool for the Aiven/Render free plans.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:3}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ==================================================
# JPA / HIBERNATE
# ==================================================
# "update" creates the tables in the new empty Aiven database.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# ==================================================
# PAYMENT-SLIP UPLOAD LIMITS
# ==================================================
# Keep these consistent with your frontend and Supabase bucket.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ==================================================
# SAMS APPLICATION
# ==================================================
app.timezone=${APP_TIMEZONE:Asia/Colombo}

# Never store the real production JWT secret in this file.
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.accessMinutes=${APP_JWT_ACCESS_MINUTES:600}
app.jwt.refreshDays=${APP_JWT_REFRESH_DAYS:7}

# Comma-separated frontend URLs allowed by CORS.
app.frontend.urls=${FRONTEND_URLS:http://localhost:5173}

# ==================================================
# SUPABASE STORAGE — S3 COMPATIBLE API
# ==================================================
app.storage.endpoint=${SUPABASE_S3_ENDPOINT}
app.storage.region=${SUPABASE_S3_REGION}
app.storage.access-key=${SUPABASE_S3_ACCESS_KEY}
app.storage.secret-key=${SUPABASE_S3_SECRET_KEY}
app.storage.bucket=${SUPABASE_STORAGE_BUCKET:payment-slips}

# ==================================================
# RENDER HEALTH CHECK
# ==================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never