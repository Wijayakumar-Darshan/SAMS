# =========================
# JPA
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# =========================
# File upload (payment slips)
# =========================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =========================
# SAMS App settings
# =========================
app.timezone=Asia/Colombo

# IMPORTANT: must be long enough for HS256 (at least 32 bytes; better 64+ chars)
app.jwt.secret=CHANGE_THIS_SECRET_TO_A_LONG_RANDOM_VALUE_64_CHARS_MINIMUM_1234567890_ABCDEF

app.jwt.accessMinutes=15
app.jwt.refreshDays=7
app.uploadsDir=./uploads